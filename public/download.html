<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('phantom-theme') || 'dark');</script>
<title>PHANTOM — Téléchargement</title>
<style>
  :root{
    --bg:#0c0713; --purple-1:#a855f7; --purple-2:#7c3aed; --purple-glow:#c084fc;
    --gold:#f5a623; --gold-2:#ffc94d;
    --text-1:#f5f3f8; --text-2:#b9b0c7; --text-3:#7d7290;
    --card-border: rgba(168,85,247,0.18);
    --pill-bg: rgba(168,85,247,0.12);
  }
  html[data-theme="light"]{
    --bg:#f4f1fb; --purple-1:#7c3aed; --purple-2:#6d28d9; --purple-glow:#9333ea;
    --gold:#d97706; --gold-2:#f59e0b;
    --text-1:#1e1b2e; --text-2:#5b5570; --text-3:#8b84a0;
    --card-border: rgba(124,58,237,0.15);
    --pill-bg: rgba(124,58,237,0.08);
  }
  html[data-theme="light"] .icon-btn{
    background:#fff; border-color: rgba(124,58,237,0.15);
    box-shadow: 0 1px 3px rgba(30,20,60,0.06);
  }

  /* Global search modal (Ctrl+K) */
  .search-modal-overlay{
    position:fixed; inset:0; z-index:200;
    background: rgba(8,4,14,0.6); backdrop-filter: blur(4px);
    display:none; align-items:flex-start; justify-content:center;
    padding-top:14vh;
  }
  .search-modal-overlay.open{ display:flex; }
  .search-modal{
    width:100%; max-width:560px; margin:0 20px;
    background: #120a1c; border:1px solid var(--card-border);
    border-radius:16px; padding:18px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  html[data-theme="light"] .search-modal{
    background:#ffffff; box-shadow: 0 30px 80px rgba(30,20,60,0.2);
  }
  .search-modal-input{
    display:flex; align-items:center; gap:12px;
    color: var(--text-1); font-size:1.02rem;
  }
  .search-modal-input svg{ flex:none; color: var(--text-3); }
  .search-modal-input input{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text-1); font-size:1.02rem; font-family:inherit;
  }
  .search-modal-input input::placeholder{ color: var(--text-3); }
  .search-modal-esc{
    flex:none; font-size:0.75rem; font-weight:600; color: var(--purple-glow);
    border:1px solid rgba(168,85,247,0.35); background: rgba(168,85,247,0.1);
    padding:4px 10px; border-radius:8px;
  }
  .search-modal-hint{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--card-border);
    display:flex; align-items:center; gap:8px;
    color: var(--text-3); font-size:0.85rem;
  }
  .search-modal-hint kbd{
    color: var(--text-1); font-weight:700; font-family:inherit;
  }
  .search-modal-results{ margin-top:10px; display:flex; flex-direction:column; gap:4px; max-height:280px; overflow-y:auto; }
  .search-modal-results a{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:10px; color: var(--text-1);
    text-decoration:none; font-size:0.92rem; font-weight:600;
  }
  .search-modal-results a:hover{ background: rgba(168,85,247,0.1); }
  .search-modal-results a span.cat{ color: var(--text-3); font-size:0.78rem; font-weight:500; }
  .search-modal-empty{ margin-top:10px; padding:14px 12px; color: var(--text-3); font-size:0.88rem; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(168,85,247,0.18), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(124,58,237,0.16), transparent 55%),
      var(--bg);
    color:var(--text-1); font-family:"Inter","Segoe UI",sans-serif;
    padding:40px 56px 80px;
  }
  a{ color:inherit; text-decoration:none; }

  /* Header / Nav */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 56px; margin: -40px -56px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-weight:800; letter-spacing:0.5px; font-size:1.05rem;
    color: var(--text-1); transition: opacity .18s ease, transform .18s ease;
  }
  .logo:hover{ opacity:0.85; transform: translateY(-1px); }
  .logo:active{ transform: translateY(0); }
  .logo-mark{
    width:28px; height:28px; object-fit:contain; display:block;
    filter: drop-shadow(0 0 8px rgba(168,85,247,0.6));
    transition: filter .18s ease;
  }
  .logo:hover .logo-mark{ filter: drop-shadow(0 0 14px rgba(168,85,247,0.85)); }
  nav{display:flex; gap:6px;}
  nav a{
    display:flex; align-items:center; gap:6px;
    color: var(--text-2); text-decoration:none; font-size:0.92rem; font-weight:500;
    padding:9px 16px; border-radius:10px; transition: all .15s ease;
  }
  nav a:hover{ color: var(--text-1); background: rgba(255,255,255,0.04); }
  nav a.active{
    color:#fff; background: linear-gradient(135deg, var(--purple-2), #6d28d9);
    box-shadow: 0 4px 18px rgba(124,58,237,0.4);
  }
  .header-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
    color: var(--text-2); cursor:pointer; position:relative;
    transition: background .15s ease, transform .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.06); color: var(--text-1); transform: translateY(-1px); }
  .icon-btn svg{ width:17px; height:17px; }
  .profile{
    display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px;
    border-radius:12px; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
    cursor:pointer; position:relative;
  }
  .avatar{
    width:26px; height:26px; border-radius:50%;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile-name{ font-size:0.88rem; font-weight:600; }
  .admin-badge{
    display:none; align-items:center; gap:6px;
    color: var(--purple-glow); text-decoration:none; font-size:0.85rem; font-weight:600;
    padding:9px 14px; border-radius:10px; border:1px solid rgba(168,85,247,0.3);
    background: rgba(168,85,247,0.08);
  }
  .profile-menu{
    position:absolute; top:calc(100% + 8px); right:0; min-width:170px;
    background: rgba(18,10,26,0.97); border:1px solid var(--card-border);
    border-radius:12px; padding:6px; display:none; flex-direction:column;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5); backdrop-filter: blur(12px); z-index:20;
  }
  .profile-menu.open{ display:flex; }
  .profile-menu button, .profile-menu a{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; color:var(--text-2); font-size:0.85rem;
    padding:9px 10px; border-radius:8px; cursor:pointer; text-decoration:none;
  }
  .profile-menu button:hover, .profile-menu a:hover{ background: rgba(255,255,255,0.06); color:var(--text-1); }
  .profile-menu .logout{ color:#f87171; }
  .profile-menu .logout:hover{ background: rgba(239,68,68,0.1); color:#f87171; }
  .btn-login{
    display:flex; align-items:center; gap:8px;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    color:#fff; border:none; padding:10px 18px; border-radius:11px;
    font-weight:700; font-size:0.9rem; cursor:pointer;
    box-shadow: 0 6px 20px rgba(124,58,237,0.4);
  }
  @media (max-width: 900px){
    header{ flex-wrap:wrap; gap:14px; padding:18px 20px; margin: -40px -56px 32px; }
    nav{ order:3; width:100%; overflow-x:auto; }
  }

  /* Breadcrumb */
  .breadcrumb{ display:flex; align-items:center; gap:8px; color:var(--text-2); font-size:0.95rem; font-weight:500; margin-bottom:22px; }
  .breadcrumb a{ display:flex; align-items:center; gap:6px; color:var(--text-2); font-weight:600; }
  .breadcrumb a:hover{ color:var(--purple-glow); }
  .breadcrumb .sep{ color:var(--text-3); }
  .breadcrumb .current{ color:var(--text-1); font-weight:700; }

  /* Title row */
  .title-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .title-row h1{
    font-size:1.7rem; font-weight:600; color:var(--text-1);
  }
  .title-row h1 .accent{
    font-weight:600;
    background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--pill-bg); border:1px solid var(--card-border);
    color:var(--text-2); font-size:0.85rem; font-weight:600;
    padding:9px 16px; border-radius:999px;
  }

  /* Statut de détection */
  .detect-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.85rem; font-weight:700; padding:9px 15px;
    border-radius:999px; border:1px solid; flex:none;
  }
  .detect-badge .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .detect-badge.detectable{ color:#f87171; border-color:rgba(239,68,68,0.35); background:rgba(239,68,68,0.12); }
  .detect-badge.detectable .dot{ background:#f87171; box-shadow:0 0 8px rgba(248,113,113,0.8); }
  .detect-badge.semi{ color:#fbbf24; border-color:rgba(251,191,36,0.35); background:rgba(251,191,36,0.12); }
  .detect-badge.semi .dot{ background:#fbbf24; box-shadow:0 0 8px rgba(251,191,36,0.8); }
  .detect-badge.undetectable{ color:#4ade80; border-color:rgba(74,222,128,0.35); background:rgba(74,222,128,0.12); }
  .detect-badge.undetectable .dot{ background:#4ade80; box-shadow:0 0 8px rgba(74,222,128,0.8); }

  /* Banner */
  .banner{
    width:100%; height:150px; border-radius:16px; margin-bottom:18px;
    background:#000 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-3); font-size:0.85rem; letter-spacing:0.02em;
    border:1px solid var(--card-border);
  }

  /* Stat pills */
  .stats{ display:flex; flex-wrap:wrap; gap:12px; margin-bottom:28px; }
  .stat{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--pill-bg); border:1px solid var(--card-border);
    color:var(--text-1); font-size:0.88rem; font-weight:600;
    padding:9px 16px; border-radius:999px;
  }
  .stat .stars{ color:var(--purple-glow); letter-spacing:1px; }

  /* Layout */
  .layout{ display:grid; grid-template-columns: 1fr 340px; gap:24px; align-items:start; }
  @media (max-width: 900px){ .layout{ grid-template-columns:1fr; } }

  .main-image{
    width:fit-content; max-width:100%; margin:0 auto;
    border-radius:16px; overflow:hidden;
  }
  .main-image img{
    display:block; max-width:100%; max-height:520px;
    width:auto; height:auto; object-fit:contain; border-radius:16px;
  }
  .main-image.empty{
    width:100%; min-height:460px; border-radius:16px;
    background-color: rgba(255,255,255,0.03);
    border:1px solid var(--card-border);
  }

  /* Sidebar */
  .sidebar{
    background: rgba(255,255,255,0.03); border:1px solid var(--card-border);
    border-radius:16px; padding:20px; position:sticky; top:24px;
  }
  .sidebar-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .sidebar-head .icon{
    width:44px; height:44px; border-radius:10px; background: var(--pill-bg);
    border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; flex:none;
  }
  .sidebar-head .name{ font-weight:700; font-size:0.95rem; }
  .sidebar-head .ver{ color:var(--text-3); font-size:0.8rem; }
  .fav{
    margin-left:auto; width:38px; height:38px; border-radius:10px;
    background: var(--pill-bg); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--purple-glow);
  }

  .dl-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border:none; border-radius:12px;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    color:#fff; font-weight:700; font-size:1rem; cursor:pointer; margin-bottom:10px;
  }
  .dl-btn:hover{ opacity:0.92; }
  .dl-btn.locked{ background: linear-gradient(135deg, var(--purple-glow), var(--purple-2)); }
  .dl-btn svg{ width:18px; height:18px; fill:#fff; flex:none; }
  .free-note{ text-align:center; color:#4ade80; font-size:0.82rem; margin-bottom:18px; }
  .free-note.locked{ color:var(--text-3); display:flex; align-items:center; justify-content:center; gap:6px; }

  .mini-stats{ display:flex; justify-content:space-between; border-top:1px solid var(--card-border); border-bottom:1px solid var(--card-border); padding:14px 0; margin-bottom:14px; }
  .mini-stats div{ display:flex; align-items:center; gap:6px; font-size:0.9rem; color:var(--text-2); }

  .copy-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px; border-radius:10px; cursor:pointer;
    background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12);
    color:var(--text-1); font-weight:600; font-size:0.9rem;
  }
  .copy-btn:hover{ background: rgba(255,255,255,0.07); }

  /* Description */
  .panels{ display:grid; grid-template-columns:1fr 340px; gap:24px; margin-top:32px; align-items:start; }
  @media (max-width: 900px){ .panels{ grid-template-columns:1fr; } }
  .panels-left, .panels-right{ display:flex; flex-direction:column; gap:24px; }
  .panel{
    background: rgba(255,255,255,0.03); border:1px solid var(--card-border);
    border-radius:16px; padding:24px;
  }
  .panel h2{ font-size:1.1rem; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .panel p{ color:var(--text-2); line-height:1.7; font-size:0.95rem; }

  .panel .video-frame{
    width:100%; border-radius:12px; overflow:hidden;
    background:#000; border:1px solid var(--card-border);
  }
  .panel .video-frame video{ display:block; width:100%; max-height:520px; }

  .loading{ color:var(--text-3); padding:60px 0; text-align:center; }

  #relatedList a:hover{ text-decoration:underline; }

  /* Versions */
  .version-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background: rgba(255,255,255,0.03); border:1px solid var(--card-border);
    border-radius:12px; padding:12px 16px; font-size:0.85rem; color:var(--text-2);
  }
  .version-row .vbadge{
    background: var(--pill-bg); color:var(--purple-glow); font-weight:700;
    padding:4px 10px; border-radius:8px; font-size:0.8rem;
  }
  .version-row .vtag{
    background: rgba(255,255,255,0.06); padding:4px 10px; border-radius:8px; font-size:0.8rem;
  }

  /* Besoin d'aide */
  .help-panel h2 svg{ width:20px; height:20px; fill:var(--purple-glow); flex:none; }
  .help-panel p{ margin-bottom:16px; }
  .discord-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px; border:none; border-radius:10px;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    color:#fff; font-weight:700; font-size:0.9rem; cursor:pointer;
  }
  .discord-btn:hover{ opacity:0.92; }
  .discord-btn svg{ width:18px; height:18px; fill:#fff; flex:none; }

  /* Avis */
  .rating-summary{ display:flex; gap:28px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .rating-big{ text-align:center; }
  .rating-big .num{ font-size:2.6rem; font-weight:800; line-height:1; }
  .rating-big .stars{ color:var(--gold); font-size:1.15rem; letter-spacing:2px; margin:8px 0 6px; }
  .rating-big .count{ color:var(--text-3); font-size:0.85rem; }
  .rating-bars{ flex:1; min-width:220px; display:flex; flex-direction:column; gap:9px; }
  .rating-bars .brow{ display:flex; align-items:center; gap:10px; font-size:0.82rem; color:var(--text-2); }
  .rating-bars .brow .label{ width:26px; text-align:right; white-space:nowrap; color:var(--gold); }
  .rating-bars .brow .track{ flex:1; height:8px; border-radius:99px; background: rgba(255,255,255,0.06); overflow:hidden; }
  .rating-bars .brow .fill{ height:100%; border-radius:99px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
  .rating-bars .brow .count{ width:18px; text-align:right; color:var(--text-3); }

  .add-review-btn{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    color:#fff; font-weight:700; font-size:0.85rem; padding:11px 20px; border-radius:10px;
    margin-bottom:20px;
  }
  .add-review-btn:hover{ opacity:0.92; }

  .review-login-prompt{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border:1.5px dashed var(--card-border); border-radius:14px;
    padding:16px 18px; margin-bottom:20px;
    background: rgba(255,255,255,0.02);
  }
  .review-login-prompt .msg{
    display:flex; align-items:center; gap:10px;
    color:var(--text-2); font-size:0.9rem;
  }
  .review-login-prompt .msg svg{ flex:none; color:var(--text-3); }
  .review-login-prompt .review-login-btn{
    display:inline-flex; align-items:center; gap:8px; flex:none;
    background: linear-gradient(135deg, var(--purple-glow), var(--purple-2));
    color:#fff; border:none; padding:11px 20px; border-radius:10px;
    font-weight:700; font-size:0.85rem; cursor:pointer; text-decoration:none;
  }
  .review-login-prompt .review-login-btn:hover{ opacity:0.92; }

  .review-form{
    display:none; background: rgba(255,255,255,0.03); border:1px solid var(--card-border);
    border-radius:12px; padding:16px; margin-bottom:20px;
  }
  .review-form.open{ display:block; }
  .review-form .stars-input{ font-size:1.4rem; letter-spacing:4px; cursor:pointer; margin-bottom:12px; color:var(--text-3); }
  .review-form .stars-input span.active{ color:var(--purple-glow); }
  .review-form textarea{
    width:100%; min-height:90px; resize:vertical; border-radius:10px; padding:12px;
    background: rgba(255,255,255,0.04); border:1px solid var(--card-border);
    color:var(--text-1); font-family:inherit; font-size:0.9rem; margin-bottom:12px;
  }
  .review-form .actions{ display:flex; gap:10px; }
  .review-form button{
    border:none; border-radius:10px; padding:10px 18px; font-weight:700; font-size:0.85rem; cursor:pointer;
  }
  .review-form .submit-btn{ background: linear-gradient(135deg, var(--purple-glow), var(--purple-2)); color:#fff; }
  .review-form .cancel-btn{ background: rgba(255,255,255,0.06); color:var(--text-2); }

  .review-item{ display:flex; gap:12px; padding:16px 0; border-top:1px solid var(--card-border); }
  .review-item:first-of-type{ border-top:none; }
  .review-avatar{
    width:36px; height:36px; border-radius:50%; flex:none; background:var(--pill-bg);
    border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.85rem; color:var(--purple-glow); object-fit:cover;
  }
  .review-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .review-head .uname{ font-weight:700; font-size:0.9rem; }
  .review-head .stars{ color:var(--gold); font-size:0.8rem; letter-spacing:1px; }
  .review-head .verified{
    background: rgba(74,222,128,0.12); color:#4ade80; font-size:0.72rem; font-weight:700;
    padding:2px 8px; border-radius:999px;
  }
  .review-head .time{ color:var(--text-3); font-size:0.78rem; }
  .review-text{ color:var(--text-2); font-size:0.9rem; line-height:1.6; }
</style>
</head>
<body>

  <header>
    <a href="/" class="logo" style="text-decoration:none;">
      <img src="/assets/logo.png" alt="PHANTOM" class="logo-mark">
      PHANTOM
    </a>
    <nav>
      <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Accueil
      </a>
      <a href="/downloads" class="active">

  <div class="search-modal-overlay" id="searchOverlay">
    <div class="search-modal">
      <div class="search-modal-input">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="searchModalInput" placeholder="Rechercher une ressource, une actualité, une page..." autocomplete="off">
        <span class="search-modal-esc">Échap</span>
      </div>
      <div id="searchModalResults" class="search-modal-results"></div>

        <span>⌘</span> Astuce : ouvre cette recherche n'importe où avec&nbsp;<kbd>Ctrl+K</kbd>
      </div>

  <div id="app" class="loading">Chargement…</div>

  <script>
    const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';

    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.innerHTML = theme === 'light' ? MOON_ICON : SUN_ICON;
      localStorage.setItem('phantom-theme', theme);
    }
    applyTheme(localStorage.getItem('phantom-theme') || 'dark');
    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      applyTheme(current === 'light' ? 'dark' : 'light');
    });

    // ---- Recherche globale (Ctrl+K / Cmd+K) ----
    (function(){
      const overlay = document.getElementById('searchOverlay');
      const input = document.getElementById('searchModalInput');
      const results = document.getElementById('searchModalResults');
      const trigger = document.getElementById('searchTrigger');

      const staticPages = [
        { name: 'Accueil', url: '/', cat: 'Page' },
        { name: 'Téléchargements', url: '/downloads', cat: 'Page' },
        { name: 'Mon profil', url: '/profile', cat: 'Page' },
      ];

      let downloadsCache = null;
      async function getDownloads(){
        if (downloadsCache) return downloadsCache;
        try {
          const res = await fetch('/api/downloads');
          const data = await res.json();
          downloadsCache = data.downloads || [];
        } catch {
          downloadsCache = [];
        }
        return downloadsCache;
      }

      function openSearch(){
        overlay.classList.add('open');
        input.value = '';
        renderResults('');
        setTimeout(() => input.focus(), 10);
      }
      function closeSearch(){
        overlay.classList.remove('open');
      }

      async function renderResults(query){
        const q = query.trim().toLowerCase();
        const downloads = await getDownloads();

        const pageMatches = staticPages.filter(p => !q || p.name.toLowerCase().includes(q));
        const dlMatches = downloads.filter(d => !q || d.name.toLowerCase().includes(q) || (d.category || '').toLowerCase().includes(q));

        const items = [
          ...pageMatches.map(p => `<a href="${p.url}"><span>${p.name}</span><span class="cat">${p.cat}</span></a>`),
          ...dlMatches.slice(0, 8).map(d => `<a href="/downloads/${d.id}"><span>${escapeSearchHtml(d.name)}</span><span class="cat">${escapeSearchHtml(d.category || '')}</span></a>`),
        ];

        results.innerHTML = items.length
          ? items.join('')
          : `<div class="search-modal-empty">Aucun résultat pour « ${escapeSearchHtml(query)} ».</div>`;
      }

      function escapeSearchHtml(s){
        return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      trigger.addEventListener('click', openSearch);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSearch(); });
      overlay.querySelector('.search-modal-esc').addEventListener('click', closeSearch);
      input.addEventListener('input', () => renderResults(input.value));

      document.addEventListener('keydown', (e) => {
        const isK = e.key === 'k' || e.key === 'K';
        if ((e.ctrlKey || e.metaKey) && isK) {
          e.preventDefault();
          overlay.classList.contains('open') ? closeSearch() : openSearch();
        } else if (e.key === 'Escape' && overlay.classList.contains('open')) {
          closeSearch();
        }
      });
    })();

    const loginBtn = document.getElementById('loginBtn');
    const profileBlock = document.getElementById('profileBlock');
    const profileMenu = document.getElementById('profileMenu');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminBadge = document.getElementById('adminBadge');
    const avatarWrap = document.getElementById('avatarWrap');

    loginBtn.addEventListener('click', () => {
      window.location.href = '/auth/discord';
    });

    profileBlock.addEventListener('click', (e) => {
      e.stopPropagation();
      profileMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => profileMenu.classList.remove('open'));

    logoutBtn.addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    function renderHeaderUser(user){
      if (user) {
        loginBtn.style.display = 'none';
        profileBlock.style.display = 'flex';
        if (user.avatar) {
          avatarWrap.innerHTML = `<img src="${user.avatar}" alt="${user.username}">`;
        } else {
          avatarWrap.textContent = user.username[0].toUpperCase();
        }
        profileBlock.querySelector('.profile-name').textContent = user.username + ' ▾';
        if (user.isAdmin) adminBadge.style.display = 'flex';
      } else {
        loginBtn.style.display = 'flex';
        profileBlock.style.display = 'none';
      }
    }
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    // Supporte à la fois /downloads/:id (route serveur) et ?id= en query
    const pathParts = location.pathname.split('/').filter(Boolean);
    const id = pathParts[1] || params.get('id');

    function discordIcon(){
      return `<svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>`;
    }

    function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // Met en avant la partie entre parenthèses d'un nom (ex: "AC Performance (Fortnite)")
    function formatTitle(name){
      const s = String(name ?? '');
      const match = s.match(/^(.*?)\s*(\([^)]*\))\s*$/);
      if (match) {
        return `${escapeHtml(match[1])} <span class="accent">${escapeHtml(match[2])}</span>`;
      }
      return escapeHtml(s);
    }

    const DETECTION_LABELS = {
      detectable: 'Détectable',
      semi: 'Semi-détectable',
      undetectable: 'Indétectable',
    };
    function detectionBadge(status){
      const key = DETECTION_LABELS[status] ? status : 'undetectable';
      return `<span class="detect-badge ${key}"><span class="dot"></span>${DETECTION_LABELS[key]}</span>`;
    }

    function timeAgo(iso){
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime();
      const days = Math.floor(diff / 86400000);
      if (days <= 0) return "aujourd'hui";
      if (days === 1) return 'il y a 1 j';
      if (days < 30) return `il y a ${days} j`;
      const months = Math.floor(days / 30);
      if (months < 12) return `il y a ${months} mois`;
      return `il y a ${Math.floor(months / 12)} an(s)`;
    }

    function stars(n){
      const full = Math.round(n || 0);
      return '★★★★★'.slice(0, full) + '☆☆☆☆☆'.slice(0, 5 - full);
    }

    async function init(){
      const meRes = await fetch('/api/me').then(r => r.json());
      const isAdmin = !!(meRes.user && meRes.user.isAdmin);
      const isLoggedIn = !!meRes.user;
      renderHeaderUser(meRes.user);

      const res = await fetch(`/api/downloads/${id}`);
      if (!res.ok) {
        document.getElementById('app').textContent = "Ce téléchargement est introuvable.";
        return;
      }
      const { item } = await res.json();

      document.title = `PHANTOM — ${item.name}`;

      const mainImageHtml = item.image
        ? `<div class="main-image"><img src="${escapeAttr(item.image)}" alt="${escapeAttr(item.name)}"></div>`
        : `<div class="main-image empty"></div>`;

      document.getElementById('app').outerHTML = `
      <div>
        <div class="breadcrumb">
          <a href="/downloads">⬇ Téléchargements</a>
          <span class="sep">›</span>
          <span class="current">${escapeHtml(item.name)}</span>
        </div>

        <div class="title-row">
          ${detectionBadge(item.detection)}
          <h1>${formatTitle(item.name)}</h1>
          <span class="badge">v${escapeHtml(item.version)}</span>
          <span class="badge">🗨 ${escapeHtml(item.category || 'Membres du serveur')}</span>
          ${isAdmin ? '<a href="/admin" class="badge">⚙ Administration</a>' : ''}
        </div>

        <div class="stats">
          <span class="stat" id="statDownloads"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> <span id="statDownloadsCount">${item.downloads || 0}</span> téléchargements</span>
          <span class="stat"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg> ${escapeHtml(item.size || '—')}</span>
          <span class="stat"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg> Mis à jour ${timeAgo(item.updatedAt)}</span>
          <span class="stat" id="statReviews"><span class="stars" id="statStars">${stars(item.rating)}</span> <span id="statReviewsCount">${item.reviewsCount || 0}</span> avis</span>
        </div>

        <div class="layout">
          ${mainImageHtml}

          <div class="sidebar">
            <div class="sidebar-head">
              <div class="icon">📄</div>
              <div>
                <div class="name">${escapeHtml(item.name)}</div>
                <div class="ver">v${escapeHtml(item.version)} — ${escapeHtml(item.size || '—')}</div>
              </div>
              <div class="fav" id="favBtn">♡</div>
            </div>

            ${isLoggedIn ? `
            <button class="dl-btn" id="dlBtn">⬇ Télécharger</button>
            <div class="free-note">✅ Téléchargement gratuit — Discord</div>
            ` : `
            <button class="dl-btn locked" id="dlBtn">${discordIcon()} Se connecter pour télécharger</button>
            <div class="free-note locked">🔒 Connexion Discord obligatoire pour télécharger</div>
            `}

            <div class="mini-stats">
              <div id="miniStatDownloads"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> <span id="miniStatDownloadsCount">${item.downloads || 0}</span></div>
              <div id="miniStatFavorites">♡ <span id="miniStatFavoritesCount">${item.favoritesCount || 0}</span></div>
              <div id="miniStatRating">☆ <span id="miniStatRatingValue">${(item.rating || 0).toFixed(1)}</span>/5</div>
            </div>

            <div class="copy-btn" id="copyBtn">🔗 Copier le lien</div>
          </div>
        </div>

        <div class="panels">
          <div class="panels-left">
            ${item.video ? `
            <div class="panel">
              <h2>🎥 Présentation vidéo</h2>
              <div class="video-frame">
                <video src="${escapeAttr(item.video)}" controls preload="metadata"></video>
              </div>
            </div>
            ` : ''}

            <div class="panel">
              <h2>ℹ️ Description</h2>
              <p>${escapeHtml(item.description || 'Aucune description pour le moment.')}</p>
            </div>

            <div class="panel">
              <h2>🗂 Versions</h2>
              <div class="version-row">
                <span class="vbadge">v${escapeHtml(item.version)}</span>
                <span class="vtag">${escapeHtml(item.category || 'Standard')}</span>
                <span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg> ${timeAgo(item.updatedAt)}</span>
                <span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg> ${escapeHtml(item.size || '—')}</span>
              </div>
            </div>

            <div class="panel">
              <h2>💬 Avis de la communauté</h2>
              <div id="reviewsBlock">Chargement…</div>
            </div>
          </div>

          <div class="panels-right">
            <div class="panel">
              <h2>📚 Dans la même catégorie</h2>
              <p id="relatedList">Chargement…</p>
            </div>

            <div class="panel help-panel">
              <h2>${discordIcon()} Besoin d'aide ?</h2>
              <p>Rejoins le serveur Discord pour le support, les annonces et les avant-premières.</p>
              <a href="https://discord.gg/hNyaAtRKvG" target="_blank" rel="noopener" class="discord-btn">${discordIcon()} Rejoindre</a>
            </div>
          </div>
        </div>
      </div>
      `;

      document.getElementById('dlBtn').addEventListener('click', async () => {
        if (!isLoggedIn) {
          // Pas connecté : on envoie vers Discord, puis on revient sur cette fiche.
          window.location.href = `/auth/discord?next=${encodeURIComponent(location.pathname)}`;
          return;
        }

        const btn = document.getElementById('dlBtn');
        const oldLabel = btn.textContent;
        btn.textContent = '⏳ Préparation…';
        btn.disabled = true;

        try {
          const r = await fetch(`/api/downloads/${item.id}/click`, { method: 'POST' });
          const data = await r.json();
          if (data.url && data.url !== '#') {
            // Déclenche un téléchargement direct (sans ouvrir un nouvel onglet).
            // Fonctionne pour un fichier servi directement ; si le lien pointe
            // vers une page tierce (Mediafire, Google Drive, etc.), le navigateur
            // suit tout de même ce lien puisque cette page ne peut pas forcer le
            // téléchargement d'une ressource qu'elle ne sert pas elle-même.
            const a = document.createElement('a');
            a.href = data.url;
            a.download = item.name || '';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
          }
        } finally {
          btn.textContent = oldLabel;
          btn.disabled = false;
        }
      });

      // ---- Rafraîchit les stats en direct (téléchargements, avis, note) ----
      window.refreshStats = async function refreshStats(){
        try {
          const r = await fetch(`/api/downloads/${item.id}`);
          if (!r.ok) return;
          const { item: fresh } = await r.json();
          if (!fresh) return;

          const setText = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.textContent = value;
          };

          setText('statDownloadsCount', fresh.downloads || 0);
          setText('statReviewsCount', fresh.reviewsCount || 0);
          setText('miniStatDownloadsCount', fresh.downloads || 0);
          setText('miniStatFavoritesCount', fresh.favoritesCount || 0);
          setText('miniStatRatingValue', (fresh.rating || 0).toFixed(1));
          const starsEl = document.getElementById('statStars');
          if (starsEl) starsEl.textContent = stars(fresh.rating);
        } catch {}
      }
      // Se met à jour automatiquement toutes les 10 secondes.
      setInterval(refreshStats, 10000);

      const dlBtnClickHandler = document.getElementById('dlBtn');
      if (dlBtnClickHandler) {
        dlBtnClickHandler.addEventListener('click', () => {
          // Laisse le temps au serveur d'incrémenter le compteur avant de rafraîchir.
          setTimeout(refreshStats, 800);
        });
      }

      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(location.href);
        const btn = document.getElementById('copyBtn');
        const old = btn.textContent;
        btn.textContent = '✅ Lien copié';
        setTimeout(() => (btn.textContent = old), 1500);
      });

      // Suggestions dans la même catégorie (même tag)
      fetch('/api/downloads').then(r => r.json()).then(({ downloads }) => {
        const others = downloads.filter(d => d.category === item.category && d.id !== item.id).slice(0, 4);
        const el = document.getElementById('relatedList');
        if (!others.length) { el.textContent = 'Aucun autre élément dans cette catégorie.'; return; }
        el.innerHTML = others.map(o => `<a href="/downloads/${o.id}" style="display:block; color:var(--purple-glow); margin-bottom:8px;">${escapeHtml(o.name)}</a>`).join('');
      });

      loadReviews(item.id);
    }

    let myRatingChoice = 0;

    async function loadReviews(itemId) {
      const block = document.getElementById('reviewsBlock');
      const res = await fetch(`/api/downloads/${itemId}/reviews`);
      if (!res.ok) { block.textContent = "Impossible de charger les avis."; return; }
      const { reviews, breakdown, myReview } = await res.json();

      const total = reviews.length;
      const avg = total ? reviews.reduce((s, r) => s + r.rating, 0) / total : 0;
      myRatingChoice = myReview ? myReview.rating : 0;

      const barsHtml = [5, 4, 3, 2, 1].map(n => {
        const count = breakdown[n] || 0;
        const pct = total ? Math.round((count / total) * 100) : 0;
        return `
          <div class="brow">
            <span class="label">${n} ★</span>
            <div class="track"><div class="fill" style="width:${pct}%"></div></div>
            <span class="count">${count}</span>
          </div>`;
      }).join('');

      const reviewsHtml = total
        ? reviews.map(r => `
          <div class="review-item">
            ${r.avatar
              ? `<img class="review-avatar" src="${escapeAttr(r.avatar)}" alt="">`
              : `<div class="review-avatar">${escapeHtml((r.username || '?').slice(0, 1).toUpperCase())}</div>`}
            <div>
              <div class="review-head">
                <span class="uname">${escapeHtml(r.username)}</span>
                <span class="stars">${stars(r.rating)}</span>
                ${r.verified ? '<span class="verified">✓ Vérifié</span>' : ''}
                <span class="time">${timeAgo(r.createdAt)}</span>
              </div>
              <div class="review-text">${escapeHtml(r.text || '')}</div>
            </div>
          </div>`).join('')
        : '<p style="color:var(--text-3); font-size:0.9rem;">Aucun avis pour le moment. Sois le premier à en laisser un !</p>';

      block.innerHTML = `
        <div class="rating-summary">
          <div class="rating-big">
            <div class="num">${avg.toFixed(1)}</div>
            <div class="stars">${stars(avg)}</div>
            <div class="count">${total} avis</div>
          </div>
          <div class="rating-bars">${barsHtml}</div>
        </div>

        ${isLoggedIn ? `
        <button class="add-review-btn" id="toggleReviewForm">➕ ${myReview ? 'Modifier mon avis' : 'Ajouter un avis'}</button>
        ` : `
        <div class="review-login-prompt">
          <div class="msg">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Connecte-toi avec Discord pour laisser un avis.
          </div>
          <a href="/auth/discord?next=${encodeURIComponent(location.pathname)}" class="review-login-btn">${discordIcon()} Connexion</a>
        </div>
        `}

        <div class="review-form" id="reviewForm">
          <div class="stars-input" id="starsInput">
            ${[1, 2, 3, 4, 5].map(n => `<span data-n="${n}">★</span>`).join('')}
          </div>
          <textarea id="reviewText" placeholder="Partage ton avis sur ce téléchargement…">${escapeHtml(myReview ? myReview.text : '')}</textarea>
          <div class="actions">
            <button class="submit-btn" id="submitReview">Publier</button>
            <button class="cancel-btn" id="cancelReview">Annuler</button>
          </div>
        </div>

        <div id="reviewsList">${reviewsHtml}</div>
      `;

      const starsInputEl = document.getElementById('starsInput');
      const paintStars = () => {
        [...starsInputEl.children].forEach(s => s.classList.toggle('active', Number(s.dataset.n) <= myRatingChoice));
      };
      paintStars();
      starsInputEl.querySelectorAll('span').forEach(s => {
        s.addEventListener('click', () => { myRatingChoice = Number(s.dataset.n); paintStars(); });
      });

      const toggleReviewFormBtn = document.getElementById('toggleReviewForm');
      if (toggleReviewFormBtn) {
        toggleReviewFormBtn.addEventListener('click', () => {
          document.getElementById('reviewForm').classList.toggle('open');
        });
      }
      document.getElementById('cancelReview').addEventListener('click', () => {
        document.getElementById('reviewForm').classList.remove('open');
      });
      document.getElementById('submitReview').addEventListener('click', async () => {
        if (!myRatingChoice) { alert('Choisis une note de 1 à 5 étoiles.'); return; }
        const text = document.getElementById('reviewText').value;
        const btn = document.getElementById('submitReview');
        btn.disabled = true;
        btn.textContent = 'Envoi…';
        try {
          const r = await fetch(`/api/downloads/${itemId}/reviews`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rating: myRatingChoice, text }),
          });
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            alert(err.error || "Impossible d'envoyer l'avis.");
            return;
          }
          await loadReviews(itemId);
          if (typeof window.refreshStats === 'function') window.refreshStats();
        } finally {
          btn.disabled = false;
          btn.textContent = 'Publier';
        }
      });
    }

    function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }

    init();
  </script>
</body>
</html>
